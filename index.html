<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="林知远的个人主页">
  <title>林知远｜个人主页</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M18 42V22h7v14h21v6H18Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #f6f9ff;
      color: #16365f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, #dbeafe 0, transparent 30%),
        radial-gradient(circle at 85% 80%, #e0edff 0, transparent 28%),
        #f8fbff;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(40px, 8vw, 72px);
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #dbeafe;
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
    }

    .label {
      display: inline-block;
      margin-bottom: 22px;
      padding: 7px 14px;
      color: #2563eb;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: #eff6ff;
      border-radius: 999px;
    }

    h1 {
      margin: 0;
      color: #0f2f57;
      font-size: clamp(2.5rem, 9vw, 4.75rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .name {
      color: #2563eb;
    }

    .intro {
      max-width: 500px;
      margin: 26px auto 0;
      color: #527092;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.9;
    }

    .line {
      width: 44px;
      height: 3px;
      margin: 30px auto 0;
      background: #60a5fa;
      border-radius: 999px;
    }

    @media (max-width: 480px) {
      main {
        padding: 42px 24px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="label">个人主页</span>
    <h1>你好，我是<br><span class="name">林知远</span></h1>
    <p class="intro">我喜欢把复杂的想法变得简单，也享受在学习、创造与生活之间发现新的可能。</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
